name: CI

# The content checks below are copied from the foundation, not written here (R-17, M-19).
#
# Copied from: miralsoft-foundation-docs, enforcement/ci/content-checks.yml
# Foundation version: 4.1.0
# Copied on: 2026-09-16
#
# Re-copied when this project raised its declared foundation version from 3.1.0 to 4.1.0.
# The template's steps were diffed against this copy first: they are unchanged since 2.0.0,
# so only the two lines above moved. That is the point of the provenance line, and it is
# worth saying that the answer was "nothing changed" rather than leaving the date to imply
# work that did not happen.
#
# Arrangement: the template's second variant, its steps pasted into the existing build job
# rather than a workflow of their own. Branch protection on this repository requires the check
# named "Build, test, format, scan", so a job of its own would report a failure and let the
# merge through anyway. Recorded in docs/decisions.md, as the template asks.
#
# One deviation, and the only one: every copied step carries `shell: bash`. The template needs
# a POSIX shell and this job runs on a Windows runner, where the default is PowerShell. Git
# Bash ships with the runner, so the scripts themselves are unchanged.

# Every branch, not only the default one. This used to be `branches: [main]`, which meant a
# collection branch gathering work towards a release was checked by nothing until somebody
# opened a pull request at the end. The checks existed and never ran, which is worse than not
# having them, because the branch looks like it is being looked after.
on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref, as the template does it. Without this a branch with an open pull request
# runs twice for the same commit, once from push and once from pull_request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Run JS-based actions on Node 24 (Node 20 is deprecated; Node 24 is the default from 2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The dotnet CLI translates its output, so "Passed!" and "has the following vulnerable
  # packages" are English only by accident of the runner's locale. A German developer machine
  # prints "Bestanden!" and "keine anfaelligen Pakete", and any check reading those strings
  # silently answers differently there than here. Pinning the CLI language makes the output the
  # same everywhere; the steps below additionally read structured output rather than prose.
  DOTNET_CLI_UI_LANGUAGE: "en"

jobs:
  build:
    name: Build, test, format, scan
    runs-on: windows-latest
    steps:
      # Pinned to an immutable digest rather than a tag (S-13). Newer than the digest the
      # template carries; the pin is this repository's to keep current.
      #
      # fetch-depth 0 because the copied commit-message check reads a range of commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the enforcement configuration
        shell: bash
        run: |
          set -eu
          test -f .miralsoft-enforcement || {
            echo "No .miralsoft-enforcement at the repository root." >&2
            echo "The hooks and this workflow both read it. See enforcement/README.md." >&2
            exit 1
          }
          cat .miralsoft-enforcement

      # R-20. A check whose only observable outcome is silence cannot be told apart from a
      # check that does nothing, so every detector is tried against something it must match
      # and something it must not, before any of them is trusted. This is not decoration:
      # the em-dash pattern loop in the shared hook once lost its patterns to shell
      # expansion and passed over almost every file it was configured to read.
      #
      # The secret probes are assembled from pieces rather than written out, because a line
      # that looks like a secret is one as far as the scan is concerned, and this file is
      # scanned like any other.
      - name: The detectors can fail
        shell: bash
        run: |
          set -euf
          fail=0
          emdash=$(printf '\342\200\224')

          printf 'planted %s here\n' "$emdash" | grep -q -- "$emdash" \
            || { echo "em-dash detector is dead" >&2; fail=1; }
          printf 'a clean line\n' | grep -q -- "$emdash" \
            && { echo "em-dash detector matches anything" >&2; fail=1; }

          pk_probe=$(printf -- '-----%s %s %s %s-----' 'BEGIN' 'RSA' 'PRIVATE' 'KEY')
          key_probe=$(printf '%s_%s = "%s"' 'api' 'key' 'abcdefghij1234567890')
          prose_probe='the api key is mentioned in ordinary prose'
          printf '%s\n' "$pk_probe" | grep -Eq 'BEGIN [A-Z ]*PRIVATE KEY' \
            || { echo "private-key pattern is dead" >&2; fail=1; }
          printf '%s\n' "$key_probe" \
            | grep -Eiq '(api[_-]?key|secret|token)["'"'"' ]*[:=]["'"'"' ]*[A-Za-z0-9_-]{16,}' \
            || { echo "api-key pattern is dead" >&2; fail=1; }
          printf '%s\n' "$prose_probe" \
            | grep -Eiq '(api[_-]?key|secret|token)["'"'"' ]*[:=]["'"'"' ]*[A-Za-z0-9_-]{16,}' \
            && { echo "api-key pattern matches ordinary prose" >&2; fail=1; }

          attribution='Co-Authored-By|Generated with|Generated by|Claude|Anthropic|OpenAI|Gemini|GPT|Copilot|AI-generated'
          strip() { sed -E 's#[A-Za-z0-9_./-]*(CLAUDE|GEMINI|AGENTS)\.md#<entrypoint-file>#g'; }
          printf 'Co-Authored-By: somebody\n' | strip | grep -Eiq "$attribution" \
            || { echo "attribution pattern is dead" >&2; fail=1; }
          printf 'Add docs/CLAUDE.md as the entrypoint\n' | strip | grep -Eiq "$attribution" \
            && { echo "attribution pattern rejects an entrypoint filename (R-09)" >&2; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "The checks below cannot be trusted, including a pass." >&2
            exit 1
          fi
          echo "Every detector fires on a planted case and stays quiet on a clean one."

      # I-02. The patterns come from .miralsoft-enforcement rather than being repeated here.
      # Matched with `case`, exactly as the hook does, where `*` also spans a slash.
      #
      # -f matters as much as the patterns do: without it, `for g in $globs` expands each
      # pattern against the working directory first and every pattern loses its meaning.
      - name: No em-dash in prose
        shell: bash
        run: |
          set -euf
          emdash=$(printf '\342\200\224')
          globs=$(sed -n 's/^CONTENT_GLOBS=//p' .miralsoft-enforcement)
          excludes=$(sed -n 's/^CONTENT_EXCLUDE=//p' .miralsoft-enforcement)
          if [ -z "$globs" ]; then
            echo "CONTENT_GLOBS is empty, so nothing would be checked (I-02)." >&2
            exit 1
          fi
          echo "globs:    $globs"
          echo "excludes: ${excludes:-none}"

          hits=""
          for f in $(git ls-files); do
            skip=""
            for e in $excludes; do
              case "$f" in $e) skip=1; break ;; esac
            done
            [ -n "$skip" ] && continue
            for g in $globs; do
              case "$f" in
              $g)
                if grep -q -- "$emdash" "$f"; then hits="$hits $f"; fi
                break
                ;;
              esac
            done
          done

          if [ -n "$hits" ]; then
            echo "Em-dash characters found (I-02):" >&2
            for h in $hits; do echo "  $h" >&2; done
            echo "Use commas, parentheses, or separate sentences." >&2
            exit 1
          fi
          echo "No em-dash characters found."

      # R-10, S-02. The same patterns the pre-commit hook applies, over the tracked files
      # rather than over a staged diff, because CI has no staging area.
      - name: No secrets
        shell: bash
        run: |
          set -euf
          fail=0
          files=$(git ls-files)

          if printf '%s\n' "$files" | xargs -r grep -lE 'BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "A private key header was found (R-10/S-02)." >&2
            fail=1
          fi
          if printf '%s\n' "$files" | xargs -r grep -lEi \
            '(api[_-]?key|secret|token)["'"'"' ]*[:=]["'"'"' ]*[A-Za-z0-9_-]{16,}'; then
            echo "An API-key-like assignment was found (R-10/S-02)." >&2
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "No secret patterns found."

      # R-09, I-06. The server-side half of the commit-msg hook. Entrypoint filenames are
      # stripped before matching, because M-12 requires every external project to carry
      # CLAUDE.md and naming a file is not attribution.
      - name: No AI attribution in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euf
          patterns='Co-Authored-By|Generated with|Generated by|Claude|Anthropic|OpenAI|Gemini|GPT|Copilot|AI-generated'
          empty='0000000000000000000000000000000000000000'

          # A new branch reports an all-zero base, and a base can be missing from a shallow
          # clone. Fall back to the head commit alone rather than checking nothing.
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "$empty" ] \
            && git rev-parse -q --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "Checking ${BASE_SHA}..${HEAD_SHA}"
            count=$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")
            msgs=$(git log --format='%H%n%B' "${BASE_SHA}..${HEAD_SHA}")
          else
            echo "No usable base, checking the head commit only."
            count=1
            msgs=$(git log --format='%H%n%B' -1 "${HEAD_SHA}")
          fi

          # R-23. This used to report success and stop when the range came out empty, which is
          # a gate reporting a pass over material it never read. An empty range means the range
          # was computed wrongly rather than that there is nothing to check, so fall back to the
          # head commit: the gate then always reads something, and always says how much.
          if [ "$count" -eq 0 ] || [ -z "$msgs" ]; then
            echo "The range named no commits; falling back to the head commit (R-23)."
            count=1
            msgs=$(git log --format='%H%n%B' -1 "${HEAD_SHA}")
          fi

          if printf '%s\n' "$msgs" \
            | sed -E 's#[A-Za-z0-9_./-]*(CLAUDE|GEMINI|AGENTS)\.md#<entrypoint-file>#g' \
            | grep -Eiq "$patterns"; then
            echo "AI-attribution marker found in a commit message (R-09/I-06)." >&2
            echo "Naming an entrypoint file is allowed; claiming an author is not." >&2
            exit 1
          fi
          echo "No AI-attribution markers in the $count commit message(s) checked."

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The plugin builds against the Dalamud assemblies of a real installation, so the runner
      # needs one. The dev channel is what the SDK looks for by default.
      - name: Download Dalamud dev libraries
        shell: pwsh
        run: |
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      # R-23. A suite that executed nothing still exits zero, and a green tick over zero tests
      # is precisely the failure that rule names: a gate that could not run, reporting a pass.
      # Drop the test project out of the solution and the old step would have said nothing.
      #
      # The count is read out of the trx file rather than out of the console summary, because
      # that summary is translated. On a German machine it reads "Bestanden!" and "gesamt",
      # so a check written against the English words would pass there without reading anything.
      - name: Test
        shell: pwsh
        run: |
          dotnet test FateCompass.slnx -c Release --no-build --verbosity normal `
            --logger "trx;LogFileName=results.trx" --results-directory artifacts/test
          if ($LASTEXITCODE -ne 0) { Write-Error "Tests failed."; exit 1 }

          $files = @(Get-ChildItem artifacts/test -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          if ($files.Count -lt 1) {
            Write-Error "No test result file was produced, so nothing here proves a test ran (R-23)."
            exit 1
          }
          $total = 0
          foreach ($file in $files) {
            [xml]$doc = Get-Content $file.FullName
            $total += [int]$doc.TestRun.ResultSummary.Counters.total
          }
          if ($total -lt 1) {
            Write-Error "The run reported $total tests. Executing nothing is not passing (R-23)."
            exit 1
          }
          Write-Host "Tests executed: $total"

      - name: Format check
        run: dotnet format FateCompass.slnx --verify-no-changes --verbosity minimal

      # The developer tools are compiled in by a file that git ignores. A published build must
      # never contain them, so the one way that could happen, somebody committing that file, is
      # checked here rather than left to .gitignore alone.
      - name: No local build switches committed
        shell: pwsh
        run: |
          if (Test-Path "Directory.Build.local.props") {
            Write-Error "Directory.Build.local.props is committed. It compiles the developer tools into the build and has to stay local."
            exit 1
          }
          Write-Host "No local build switches present."

      # S-08, with R-23 on top of it. The previous version of this step read the console text
      # for an English phrase and never looked at the exit code, so a scan that failed to run
      # printed its error, matched nothing, and went green. Two things were wrong with it: a
      # failure was indistinguishable from a clean result, and the phrase it looked for only
      # appears in English, which this machine is not.
      #
      # It now reads structured output, checks the scan actually inspected this solution, and
      # proves its own detector can fire before a clean result is believed (R-20).
      - name: Vulnerable dependency scan
        shell: pwsh
        run: |
          function Get-Vulnerable($document) {
            $hits = @()
            foreach ($project in @($document.projects)) {
              foreach ($framework in @($project.frameworks)) {
                $packages = @($framework.topLevelPackages) + @($framework.transitivePackages)
                foreach ($package in $packages) {
                  if ($package -and $package.vulnerabilities) {
                    $hits += "$($project.path): $($package.id)"
                  }
                }
              }
            }
            return $hits
          }

          $planted = '{"projects":[{"path":"p","frameworks":[{"topLevelPackages":[{"id":"Bad","vulnerabilities":[{"severity":"high"}]}]}]}]}'
          if (@(Get-Vulnerable ($planted | ConvertFrom-Json)).Count -lt 1) {
            Write-Error "The vulnerability detector does not fire on a planted finding (R-20)."
            exit 1
          }
          $clean = '{"projects":[{"path":"p","frameworks":[{"topLevelPackages":[{"id":"Fine"}]}]}]}'
          if (@(Get-Vulnerable ($clean | ConvertFrom-Json)).Count -ne 0) {
            Write-Error "The vulnerability detector flags a clean project (R-20)."
            exit 1
          }

          $raw = dotnet list package --vulnerable --include-transitive --format json | Out-String
          $code = $LASTEXITCODE
          Write-Host $raw
          if ($code -ne 0) {
            Write-Error "The scan exited $code, so it did not run. A gate that could not run has not passed (R-23)."
            exit 1
          }
          # Restore chatter can precede the payload, so start at the first brace rather than
          # handing the whole stream to the parser.
          $start = $raw.IndexOf('{')
          if ($start -lt 0) {
            Write-Error "The scan produced no JSON payload, so there is nothing to judge (R-23)."
            exit 1
          }
          $document = $raw.Substring($start) | ConvertFrom-Json
          $count = @($document.projects).Count
          if ($count -lt 1) {
            Write-Error "The scan named no project, so it cannot have inspected this solution (R-23)."
            exit 1
          }
          $found = Get-Vulnerable $document
          if ($found.Count -gt 0) {
            Write-Error "Vulnerable packages detected: $($found -join ', ')"
            exit 1
          }
          Write-Host "Scan inspected $count project(s) and found no vulnerable packages."
